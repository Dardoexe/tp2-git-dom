<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Área del Terreno</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Calculadora de Área del Terreno</h1>

  <label for="a">Altura total (A):</label>
  <input type="number" id="a" step="0.01"><br>

  <label for="b">Base (B):</label>
  <input type="number" id="b" step="0.01"><br>

  <label for="c">Altura del rectángulo (C):</label>
  <input type="number" id="c" step="0.01"><br>

  <button onclick="calcularArea()">Calcular Área</button>

  <p id="resultado"></p>

  <script src="script.js"></script>
</body>
</html>
